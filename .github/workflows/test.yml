name: test
on: [push, pull_request]
jobs:
  build-ports:
    name: Build all the ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      # Test that a package depending on all packages can be built
      - run: nix build .#debug.dependOnAll
