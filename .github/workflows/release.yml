name: release

on:
  push:
    tags:
    - '*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix build .#repo_zip
      - run: cp result/alice-ports.zip ./alice-ports-${{ github.ref_name }}.zip
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "*.zip"
